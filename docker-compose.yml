services:
  postgres:
    image: postgres:16-alpine
    container_name: onevibe-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: onevibe
      POSTGRES_PASSWORD: onevibe
      POSTGRES_DB: onevibe
    volumes:
      - onevibe_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onevibe -d onevibe']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: onevibe-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - onevibe_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  onevibe_pg_data:
  onevibe_redis_data:
